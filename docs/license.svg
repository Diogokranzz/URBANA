<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a10"/>
      <stop offset="1" stop-color="#120d07"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#e8c35a"/>
      <stop offset="1" stop-color="#8a651d"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#ds)">
    <rect x="6" y="6" width="548" height="108" rx="12" fill="url(#card)" stroke="url(#gold2)" stroke-width="2"/>
    <rect x="14" y="14" width="532" height="92" rx="8" fill="none" stroke="#e8c35a" stroke-opacity="0.28" stroke-width="1"/>
  </g>

  <g>
    <circle cx="62" cy="60" r="26" fill="#0c0e10" stroke="url(#gold2)" stroke-width="2.4"/>
    <g stroke="#e8c35a" stroke-width="2">
      <line x1="62" y1="40" x2="62" y2="48"/>
      <line x1="62" y1="72" x2="62" y2="80"/>
      <line x1="42" y1="60" x2="50" y2="60"/>
      <line x1="74" y1="60" x2="82" y2="60"/>
    </g>
    <circle cx="62" cy="60" r="6" fill="none" stroke="#e8c35a" stroke-width="1.6"/>
    <circle cx="62" cy="60" r="2.4" fill="#ff4b38">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#e8c35a" stroke-width="1.2" opacity="0.5">
      <line x1="46" y1="60" x2="52" y2="60"/>
      <line x1="72" y1="60" x2="78" y2="60"/>
      <animateTransform attributeName="transform" type="rotate" from="0 62 60" to="360 62 60" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="104" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" letter-spacing="6" font-weight="700" fill="#e8c35a">LICENÇA AUTORAL</text>
  <text x="104" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f2f5f7">Diogo Kranz</text>
  <text x="104" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#b7c4cc">Todos os direitos reservados ao autor</text>

  <text x="472" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="2" fill="#8a651d">©</text>
</svg>
